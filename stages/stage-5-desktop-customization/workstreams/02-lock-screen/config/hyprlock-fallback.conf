# K41 managed emergency lock fallback.
# Kept deliberately minimal; authentication remains Hyprlock's default PAM path.
# Source: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/
general {
    hide_cursor = false
}

background {
    monitor =
    color = rgba(000000ff)
}

input-field {
    monitor =
    size = 40%, 5%
    outline_thickness = 2
    inner_color = rgba(000000cc)
    outer_color = rgba(80aaffff)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    rounding = 8
    font_family = Monospace
    placeholder_text = Enter password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -80
    halign = center
    valign = center
}
