name: Bash validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bash-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-tests:
    name: Syntax, lint, and test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install declared test and lint dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y jq python3 gcc shellcheck shfmt

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' shell_files < <(
            find . -type f \( -name '*.sh' -o -name installer \) -not -path './.git/*' -print0
          )
          if (( ${#shell_files[@]} == 0 )); then
            echo 'No Bash files found.' >&2
            exit 1
          fi
          for file in "${shell_files[@]}"; do
            bash -n "$file"
            printf 'PASS: bash -n %s\n' "$file"
          done

      - name: Run ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' shell_files < <(
            find . -type f \( -name '*.sh' -o -name installer \) -not -path './.git/*' -print0
          )
          shellcheck --severity=error "${shell_files[@]}"

      - name: Check formatting of new test infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail
          shfmt -d -i 2 scripts/k41-live-validation.sh scripts/live-validation.sh scripts/x280-install-readiness.sh scripts/x280-archiso-test.sh tests/run.sh tests/helpers/storage-fixtures.sh tests/test-native-storage-handle.sh

      - name: Run repository test suite
        shell: bash
        run: bash tests/run.sh
