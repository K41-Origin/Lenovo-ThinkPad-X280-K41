name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  shell-and-fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck gdisk parted cryptsetup dosfstools e2fsprogs

      - name: Validate Bash syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          bash -n installer

      - name: ShellCheck installer changes
        run: |
          shellcheck --severity=error -e SC1091 stages/stage-2-basic-arch-install/scripts/k41-install-basic-arch.sh stages/stage-3-desktop-install/scripts/k41-install-desktop.sh tests/test-bootstrap-archiso.sh stages/stage-2-basic-arch-install/scripts/install-arch-x280.sh stages/stage-2-basic-arch-install/scripts/configure-arch-x280.sh tests/test-arch-installer-script.sh tests/test-arch-config-script.sh tests/test-pinned-device-path.sh tests/test-desktop-setup.sh tests/test-desktop-validation.sh tests/test-desktop-repair.sh stages/stage-4-desktop-validation/scripts/k41-desktop-repair.sh stages/stage-3-desktop-install/scripts/setup-desktop-x280.sh stages/stage-4-desktop-validation/scripts/k41-desktop-validation.sh stages/stage-4-desktop-validation/scripts/test-desktop-x280.sh stages/stage-4-desktop-validation/scripts/test-caelestia-x280.sh scripts/test-caelestia-permissions-x280.sh scripts/fix-caelestia-cache-permissions-x280.sh scripts/audit-x280-hardware.sh tests/test-hardware-audit.sh scripts/audit-x280-power-management.sh tests/test-power-management-audit.sh stages/stage-5-desktop-customization/workstreams/01-boot-experience/scripts/k41-configure-boot-experience.sh stages/stage-5-desktop-customization/workstreams/01-boot-experience/scripts/k41-install-plymouth-theme.sh stages/stage-5-desktop-customization/workstreams/01-boot-experience/scripts/k41-install-animated-boot-splash.sh stages/stage-5-desktop-customization/workstreams/01-boot-experience/scripts/k41-enable-caelestia-autologin.sh stages/stage-5-desktop-customization/workstreams/01-boot-experience/scripts/k41-lock-caelestia-after-start.sh stages/stage-5-desktop-customization/workstreams/01-boot-experience/scripts/k41-start-hyprland.sh stages/stage-5-desktop-customization/workstreams/01-boot-experience/scripts/k41-install-hyprland-launcher.sh stages/stage-5-desktop-customization/workstreams/01-boot-experience/scripts/k41-plymouth-quit-after-lock.sh stages/stage-5-desktop-customization/workstreams/02-lock-screen/scripts/k41-apply-lockscreen-design.sh stages/stage-5-desktop-customization/workstreams/02-lock-screen/scripts/k41-lockscreen-audit.sh stages/stage-5-desktop-customization/workstreams/02-lock-screen/scripts/k41-report-lockscreen-session.sh stages/stage-5-desktop-customization/workstreams/02-lock-screen/scripts/k41-report-lockscreen-failure.sh stages/stage-5-desktop-customization/workstreams/02-lock-screen/scripts/k41-report-lockscreen-permissions.sh

      - name: Run repository test suite
        run: bash tests/run.sh
